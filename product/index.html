<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <title>年会抽奖</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <!-- <link rel="stylesheet" href="./index.css"> -->
  </head>

  <body>
    <script src="./lib/tween.min.js"></script>


    <div class="cosmos"><div class="orbital-path"></div><div class="planet"></div></div>
    <header class="screen-header"><div class="header-left"><a class="settings-link icon-button" href="/admin.html" aria-label="活动设置" title="活动设置" data-icon="gear"></a><div class="identity"><div class="eyebrow">ORBITAL / LOTTERY</div><strong>星际抽奖控制台</strong></div></div><h1 id="eventTitle"></h1><div class="header-right"><div class="connection">SYSTEM ONLINE</div><div class="theme-control"><button id="themeToggle" class="icon-button" aria-label="切换 UI 主题" title="切换 UI 主题" aria-expanded="false" data-icon="palette"></button><div id="themeMenu" class="theme-menu none" role="menu" aria-label="UI 主题"></div></div><span id="themeLabel" class="theme-label"></span><div class="music">
      <audio id="music" src="./data/music.mp3" class="music-item" loop></audio>
      <div id="musicBox" class="music-box icon-button" role="button" tabindex="0" aria-label="播放或暂停背景音乐" title="播放/暂停背景音乐">♫</div>
    </div>

    </div></header>
    <aside class="prize-panel"><div class="prize-panel-title">MISSION REWARDS <span>奖项序列</span></div><div id="prizeBar"></div></aside>
    <aside class="telemetry"><div class="telemetry-label">CREW MEMBERS / 参与人员</div><div class="telemetry-value"><span id="crewTotal">—</span><small>人</small></div><div class="telemetry-label">AVAILABLE / 当前奖池</div><div class="telemetry-value"><span id="crewAvailable">—</span><small>人</small></div><div class="telemetry-foot"><span id="renderStatus">正在初始化渲染</span><br>READY FOR THE NEXT SIGNAL</div></aside>
    <div class="screen-footer"><span>◈</span> ORBITAL STATION<br>YOUR NEXT LUCKY COORDINATE</div>

    <div id="container"></div>

    <div id="menu">
      <button id="enter">进入抽奖</button>
      <div id="lotteryBar" class="none">
        <button id="lottery">开始抽奖</button>
        <button id="reLottery">重新抽奖</button>
        <div class="fixed-bar">
          <button id="save" class="fixed-btn">导出抽奖结果</button>
          <button id="reset" class="fixed-btn">重置</button>
        </div>
      </div>
    </div>

    <div class="qipao-container"></div>
  <script type="module" src="/src/lottery/index.js"></script>
  </body>
</html>
