usage: |
  本版直接基于 moshang-ax/lottery 的 vue 分支，保留原版大屏与抽奖流程。
  点击左上角齿轮配置年份和背景；名单与奖项沿用原项目配置方式。
  本版活动数据位于独立的 upstream-lottery 目录，不读取此前改造版的数据。
application:
  subdomain: wlabby-lottery
  image: embed:lottery
  run_as: "1000:1000"
  workdir: /app
  environment:
    HOST: 0.0.0.0
    PORT: "8888"
    LOTTERY_DATA_DIR: /lzcapp/var/upstream-lottery
    LOTTERY_TRUST_PROXY: "1"
    LOTTERY_PUBLIC_ORIGIN: "https://{{ .S.AppDomain }}"
  routes:
    - /=exec://8888,/app/start.sh
  entries:
    - id: settings
      title: 年份与背景设置
      path: /admin.html
  health_check:
    test_url: http://127.0.0.1:8888/health
    start_period: 60s
    timeout: 5s
  injects:
    - id: lazycat-file-bridge
      on: request
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const prefix = "/__lazycat_file_bridge";
            const host = String(ctx.request.host || "").split(":")[0].toLowerCase();
            const dot = host.indexOf(".");
            const allowed = ["GET", "HEAD", "PUT"].includes(String(ctx.request.method || "").toUpperCase());
            if (dot <= 0 || !host.endsWith(".heiyu.space") || !allowed) {
              ctx.response.send(allowed ? 400 : 405, "Invalid file bridge request");
              return;
            }
            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to("https://file." + host.slice(dot + 1), {
              path: "/files/home" + ctx.request.path.slice(prefix.length),
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: file-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            fileBridgeRoot: /__lazycat_file_bridge
            locale: auto
