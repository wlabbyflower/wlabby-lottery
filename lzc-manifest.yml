usage: '本版修复本地和网盘文件选择器在上传弹窗中被遮挡的问题，保留可编辑年份及常用年份列表。

  进入“全局配置 → 界面配置 → 图案设置”，输入四位年份并点击“添加并应用年份”。

  配置、名单、图片和中奖记录保存在当前浏览器。换设备或清除浏览器数据不会自动同步，请先导出备份。

  默认图片和音乐部分使用上游在线资源，离线时请自行上传本地素材。'
application:
  image: registry.lazycat.cloud/abby/library/node:8084dbd2076b7ba6
  subdomain: log-lottery
  routes:
  - /=exec://8080,/lzcapp/pkg/content/start.sh
  entries:
  - id: main
    title: lottery
    path: /log-lottery/
  - id: settings
    title: 抽奖配置
    path: /log-lottery/config/global/face
  injects:
  - id: lazycat-file-bridge
    on: request
    when:
    - /__lazycat_file_bridge/*
    do:
    - src: "const h = String(ctx.request.host || \"\").split(\":\")[0].toLowerCase();\n\
        const p = h.indexOf(\".\");\nconst m = String(ctx.request.method || \"\").toUpperCase();\n\
        if (p <= 0 || !h.endsWith(\".heiyu.space\") || ![\"GET\", \"HEAD\", \"PUT\"\
        ].includes(m)) {\n  ctx.response.send([\"GET\", \"HEAD\", \"PUT\"].includes(m)\
        \ ? 400 : 405, \"Invalid file bridge request\");\n  return;\n}\nctx.headers.del(\"\
        Origin\");\nctx.headers.del(\"Referer\");\nctx.proxy.to(\"https://file.\"\
        \ + h.slice(p + 1), {\n  path: \"/files/home\" + ctx.request.path.slice(\"\
        /__lazycat_file_bridge\".length),\n  query: ctx.request.raw_query,\n  use_target_host:\
        \ true,\n  timeout_ms: 120000,\n  on_fail: \"error\"\n});\n"
  - id: lazycat-file-chooser
    on: browser
    when:
    - /*
    do:
    - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
